name: Publish protocols and SCAN
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build SCAN interface
        working-directory: scan-form-assistant
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Preserve existing site and add compiled SCAN
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site --exclude=scan-form-assistant --exclude=.github
          mkdir -p _site/scan-form-assistant
          cp -R scan-form-assistant/dist/. _site/scan-form-assistant/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
