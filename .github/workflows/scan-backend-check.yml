name: Check SCAN backend
on:
  push:
    paths:
      - 'scan-form-assistant/tests/backend-smoke.mjs'
      - '.github/workflows/scan-backend-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        working-directory: scan-form-assistant
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test GitHub household workflow
        run: node scan-form-assistant/tests/backend-smoke.mjs
